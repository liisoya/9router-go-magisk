name: Sync upstream (notify-only)

# ADR-0008 起初设计为「检测上游 Release → 自动合并基线 → bump → build.sh 全部门禁 → commit+tag」，
# 发布本体由该 tag 触发的 release.yml 完成。
#
# 现实（2026-10-15 调研，docs/INVESTIGATION-20261015-dns-and-upstream-sync.md）：
#   本仓从 v1.9.7 重度分叉，上游已到 v1.9.13，`git merge --no-ff <tag>` 每天撞 13 个冲突文件
#   → 熔断步（原第 7 步）每天 exit 1；更糟的是熔断本应开的 sync-failed issue 因**标签不存在**
#   而从未开出（`gh issue create --label sync-failed` 报错）→ 一片红但零通知。
#
# 结论（ADR-0009）：自动合并在当前定制深度下结构性走不通。改为 **detect + notify**——
#   只检测上游新 Release 并开/更新一个 issue 提醒人工按 AGENT-CONVENTIONS §7 合并；
#   合并 / 构建 / tag / 推送全部交回人工可控流程。
#
# ⏸  自动运行已暂停：下面的 schedule 已注掉（原每日 UTC 22:00 = 北京 06:00）。
#    它现在**只会开 issue 提醒**，不会再尝试合并/构建/推送——所以恢复每日提醒是安全的：
#    取消 schedule 那行的注释即可。手动跑一次：Actions → Sync upstream → Run workflow。

on:
  # schedule:
  #   - cron: "0 22 * * *"   # 暂停中；恢复"每日提醒器"时取消本行注释（纯通知，不再合并）
  workflow_dispatch:

permissions:
  contents: read      # 不再需要写：合并/构建/tag/推送都交给人工
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPO: luqman-v1/9router-go
  NOTIFY_LABEL: upstream-sync     # 提醒 issue 用的标签（不存在则本流程自动创建）

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect upstream release
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(gh api "repos/${UPSTREAM_REPO}/releases/latest" --jq .tag_name)"
          LOCAL="v$(cat VERSION)"
          echo "upstream=${TAG} local=${LOCAL}"
          if [ "${TAG}" = "${LOCAL}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          fi

      # 标签不存在 → `gh issue create --label` 会失败。这正是旧熔断步静默失败、从不开口子的根因，
      # 所以先幂等建标签，保证后面一定能开出 issue（已存在则创建命令非零，忽略即可）。
      - name: Ensure notify label exists
        if: steps.detect.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "$NOTIFY_LABEL" \
            --description "上游 9router-go 发布新版本，待人工按 AGENT-CONVENTIONS §7 合并（ADR-0009）" \
            --color "0e8a16" 2>/dev/null || echo "标签已存在，跳过创建"

      - name: Open / refresh upstream-sync issue
        if: steps.detect.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TAG: ${{ steps.detect.outputs.tag }}
        run: |
          LOCAL="v$(cat VERSION)"
          EXISTING="$(gh issue list --label "$NOTIFY_LABEL" --state open --json number --jq '.[0].number')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "仍待同步：上游 ${TAG}（本地 ${LOCAL}）。运行：${RUN_URL}"
            echo "已更新既有 issue #${EXISTING}"
          else
            BODY="$(cat <<EOF
          自动同步已改为 detect+notify（ADR-0009）：检测到上游 ${UPSTREAM_REPO} 发布 **${TAG}**，本仓在 **${LOCAL}**。

          请按 AGENT-CONVENTIONS.md §7「上游同步流程（引擎发新版时）」人工合并：
          1. \`git fetch origin --tags\`；以本地 \`git log --oneline ${LOCAL}..${TAG}\` + \`git diff --stat\` 为准（不只读 release notes）
          2. 逐条裁决 \`tools/patches/*\`（被上游吸收→撤；未吸收→留）
          3. 冲突按 §10.2 共享文件清单核对；合并后复跑 \`tools/check.sh --all\`
          4. \`bash build.sh\` → 真机验证 → \`scripts/bump-version.sh ${TAG#v}\` → tag \`v${TAG#v}-r1\` → 推送触发 release.yml

          已知本次合并基线 v1.9.7 → v1.9.13 撞 13 个冲突文件，逐文件裁定见
          docs/INVESTIGATION-20261015-dns-and-upstream-sync.md。

          - 运行日志：${RUN_URL}
          合并发版完成后请手动关闭本 issue。
          EOF
          )"
            gh issue create --label "$NOTIFY_LABEL" --title "上游新版本 ${TAG} 待人工同步（当前 ${LOCAL}）" --body "$BODY"
          fi
