name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY_IMAGE: luqmenul/9router-go

jobs:
  binaries:
    name: Build release binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Build Web SPA
        run: |
          cd web
          bun install --frozen-lockfile
          bun run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Build all platforms
        run: make cross

      - name: Generate changelog
        id: changelog
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Try to extract section for this version tag from CHANGELOG.md
          if [ -f CHANGELOG.md ]; then
            NOTES=$(awk "/## \\[$TAG\\]/{flag=1; next} /## \\[v/{flag=0} flag" CHANGELOG.md)
          fi
          if [ -n "$NOTES" ]; then
            echo "$NOTES" > /tmp/changelog.md
          else
            # Fallback to git log
            PREV_TAG=$(git tag --sort=-version:refname | grep '^v' | head -2 | tail -1)
            if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "${GITHUB_REF_NAME}" ]; then
              LOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
            else
              LOG=$(git log --pretty=format:"- %s (%h)" --no-merges ${PREV_TAG}..${GITHUB_REF_NAME})
            fi
            echo "$LOG" > /tmp/changelog.md
          fi
          cat /tmp/changelog.md

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            9router-go-linux-amd64
            9router-go-linux-arm64
            9router-go-darwin-amd64
            9router-go-darwin-arm64
            9router-go-windows-amd64.exe
            SHA256SUMS.txt
          body_path: /tmp/changelog.md
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build and push Docker image
    # ADR-0008：Docker 与模块发布无关；fork 无 DOCKERHUB_* secret 与 prod environment，
    # 每次打 tag 必挂一个红叉——仅在上游仓库运行，fork 上禁用。
    if: github.repository == 'luqman-v1/9router-go'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ADR-0008：模块整包发布——由 sync-upstream 流水线打的 vX.Y.Z-rN tag 触发（或手动 dispatch）。
  # needs binaries 保证 Release 已创建，避免两个 job 并发建 release 竞态。
  magisk:
    name: Build and publish Magisk module zip
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      # build.sh 七步含全部门禁（web 构建、离线回归、schema 断言、arm64 交叉编译、zip 校验），
      # 任一步失败即熔断；node/python3 由 runner 预装
      - name: Build module zip
        run: ./build.sh

      - name: Upload module zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # update.json 是设备端在线更新的清单，必须在发布后同步指向新 zip
      - name: Update update.json
        env:
          REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          CODE="$(grep '^versionCode=' module/module.prop | cut -d= -f2)"
          python3 - "$TAG" "$VER" "$CODE" "$REPO" <<'EOF'
          import json, pathlib, sys
          tag, ver, code, repo = sys.argv[1:5]
          p = pathlib.Path("update.json")
          d = json.loads(p.read_text())
          d["version"] = tag
          d["versionCode"] = int(code)
          d["zipUrl"] = f"https://github.com/{repo}/releases/download/{tag}/9router-go-{ver}-magisk.zip"
          d["changelog"] = (
              f"模块整包更新：引擎基线同步上游 v{ver.split('-')[0]}，"
              "详细变更见 Release 页。"
          )
          p.write_text(json.dumps(d, indent=2, ensure_ascii=False) + "\n")
          EOF
          cat update.json

      - name: Commit update.json to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          if git diff --cached --quiet; then
            echo "update.json unchanged"
          else
            git commit -m "chore(release): update.json → ${GITHUB_REF_NAME}"
            git push origin HEAD:main
          fi
